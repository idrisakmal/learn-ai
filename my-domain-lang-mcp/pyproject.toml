[project]
name = "my-domain-lang-mcp"
version = "0.1.0"
description = "Module 5 exercise — stdio MCP server wrapping the knowledge-graph CLI"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
my-domain-lang-mcp-stdio = "stdio_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stdio_server"]

[tool.pytest.ini_options]
testpaths = ["stdio_server"]
python_files = ["*_test.py"]
asyncio_mode = "auto"
